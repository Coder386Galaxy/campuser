<style>
  :root{
    --bg:#f4f6f3; --panel:#ffffff; --ink:#1f2a24; --muted:#6b7a72; --line:#e3e8e4;
    --brand:#2f7d5b; --brand-dark:#245f46; --brand-soft:#e4f2ea; --accent:#f2a33a; --danger:#d9534f;
    --shadow:0 1px 2px rgba(20,40,30,.06),0 8px 24px rgba(20,40,30,.06); --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;color:inherit}
  a{color:var(--brand)}

  /* Sidebar */
  .sidebar{width:240px;background:#1d3b2e;color:#dfeee6;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;flex-shrink:0}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.3px;color:#fff;padding:4px 8px 22px}
  .logo svg{width:36px;height:36px;border-radius:9px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:#c6dccf;padding:11px 12px;border-radius:10px;font-size:15px;text-align:left;margin-bottom:4px}
  .nav button:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav button.active{background:var(--brand);color:#fff;font-weight:600}
  .nav svg{width:20px;height:20px;flex-shrink:0}
  .sidebar .spacer{flex:1}
  .sidebar .foot{font-size:12px;color:#8fb3a0;padding:8px 12px;line-height:1.5}
  .sidebar .foot button{background:none;border:1px solid rgba(255,255,255,.2);color:#c6dccf;border-radius:8px;padding:6px 10px;font-size:12px;margin:4px 4px 0 0}
  .sidebar .foot button:hover{background:rgba(255,255,255,.08)}

  /* Main */
  main{flex:1;min-width:0;padding:28px 36px 60px;max-width:1300px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
  h1{font-size:28px;margin:0;letter-spacing:-.4px}
  .sub{color:var(--muted);margin:4px 0 0;font-size:14px}
  .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink);transition:.15s}
  .btn:hover{border-color:#c9d3cd;background:#fafbfa}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-dark)}
  .btn.danger{color:var(--danger);border-color:#f0c6c4}
  .btn.danger:hover{background:#fdf1f0}
  .btn.sm{padding:6px 10px;font-size:13px}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn svg{width:16px;height:16px}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:26px}
  .stat{background:var(--panel);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center}
  .stat .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
  .stat .ic svg{width:22px;height:22px}
  .stat .v{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1}
  .stat .l{font-size:13px;color:var(--muted);margin-top:4px}

  .card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px}
  .card h2{font-size:17px;margin:0 0 14px}
  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
  @media(max-width:1000px){.grid2{grid-template-columns:1fr}}

  /* Toolbar */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
  .search{flex:1;min-width:220px;position:relative}
  .search input{width:100%;padding:10px 12px 10px 38px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
  .toolbar select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}

  /* Camp cards */
  .camps{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
  .camp{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:.18s;display:flex;flex-direction:column}
  .camp:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(20,40,30,.06),0 14px 30px rgba(20,40,30,.12)}
  .camp .band{height:92px;position:relative;display:flex;align-items:flex-end;padding:12px 16px}
  .camp .band .emoji{font-size:38px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
  .camp .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
  .camp .name{font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .camp .meta{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .camp .meta svg{width:14px;height:14px}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.2px;text-transform:uppercase;white-space:nowrap}
  .pill.upcoming{background:#e5f0fb;color:#2b64a8}
  .pill.active{background:#e4f2ea;color:#237a4c}
  .pill.past{background:#eeeeee;color:#666}
  .pill.draft{background:#fff3df;color:#a86a12}
  .progress{height:7px;background:#eef1ef;border-radius:99px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:.3s}
  .progress i.full{background:var(--accent)}
  .cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

  .empty{text-align:center;color:var(--muted);padding:56px 20px;border:2px dashed var(--line);border-radius:var(--radius);background:#fafbfa}
  .empty .big{font-size:44px;margin-bottom:8px}
  .empty p{margin:6px 0 16px}

  /* Detail */
  .back{background:none;border:0;color:var(--muted);padding:0;font-size:14px;display:inline-flex;gap:6px;align-items:center;margin-bottom:12px}
  .back:hover{color:var(--ink)}
  .hero{border-radius:var(--radius);padding:26px 28px;color:#fff;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;box-shadow:var(--shadow);margin-bottom:20px;flex-wrap:wrap;position:relative;overflow:hidden}
  .hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% 10%,rgba(255,255,255,.25),transparent 45%)}
  .hero>*{position:relative}
  .hero h1{color:#fff;font-size:30px;display:flex;align-items:center;gap:12px}
  .hero .meta{opacity:.92;font-size:14px;margin-top:8px;display:flex;gap:18px;flex-wrap:wrap}
  .hero .actions{display:flex;gap:8px}
  .hero .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff;backdrop-filter:blur(4px)}
  .hero .btn:hover{background:rgba(255,255,255,.28)}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
  .tabs button{background:none;border:0;padding:10px 14px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:600}
  .tabs button.active{color:var(--brand);border-color:var(--brand)}
  .tabs button .n{background:#eef1ef;color:var(--muted);border-radius:99px;padding:1px 7px;font-size:11px;margin-left:6px}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700}
  td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tr:hover td{background:#fafbfa}
  .avatar{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:12px;color:#fff;margin-right:10px;vertical-align:middle}
  .status-sel{padding:4px 8px;border-radius:8px;border:1px solid var(--line);font-size:13px;background:#fff}
  .icon-btn{background:none;border:0;padding:6px;border-radius:8px;color:var(--muted);display:inline-grid;place-items:center}
  .icon-btn:hover{background:#f0f2f0;color:var(--danger)}
  .icon-btn svg{width:16px;height:16px}

  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .kv div{background:#fafbfa;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .kv b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;font-weight:700}
  .kv span{font-size:15px;font-weight:600}
  .desc{white-space:pre-wrap;line-height:1.6;color:#33413a;margin:16px 0 0}

  .day{margin-bottom:18px}
  .day h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
  .act{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff}
  .act .t{font-weight:700;font-variant-numeric:tabular-nums;min-width:58px;color:var(--brand)}
  .act .n{flex:1}
  .act .n small{display:block;color:var(--muted);font-size:12px}
  .act .loc{font-size:12px;color:var(--muted);background:#f0f2f0;padding:3px 8px;border-radius:99px}

  .checklist label{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;border-bottom:1px solid var(--line)}
  .checklist label:hover{background:#fafbfa}
  .checklist input{width:17px;height:17px;accent-color:var(--brand)}
  .checklist .done{text-decoration:line-through;color:var(--muted)}
  .inline-add{display:flex;gap:8px;margin-top:12px}
  .inline-add input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:10px}

  .staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .staff .p{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;position:relative}
  .staff .p .avatar{width:40px;height:40px;font-size:14px;margin:0}
  .staff .p .r{font-size:12px;color:var(--muted)}
  .staff .p .icon-btn{position:absolute;right:6px;top:6px}

  /* Announcements */
  .feed{display:flex;flex-direction:column;gap:12px}
  .post{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#fff}
  .post.pinned{border-color:#f5d9a8;background:#fffaf1}
  .post-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .post-title{font-weight:700;font-size:16px}
  .post-meta{font-size:12px;color:var(--muted);margin-top:2px}
  .post-actions{display:flex;gap:2px;flex-shrink:0}
  .post-actions .icon-btn:hover{color:var(--ink)}
  .post-body{margin-top:10px;line-height:1.6;white-space:pre-wrap;font-size:14px;color:#33413a}
  .post-body a{word-break:break-all}
  .post-link{display:flex;gap:12px;align-items:center;margin-top:12px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#fafbfa;text-decoration:none;color:var(--ink)}
  .post-link:hover{border-color:var(--brand);background:var(--brand-soft)}
  .post-link-ic{font-size:20px}
  .post-link b{display:block;font-size:14px}
  .post-link small{color:var(--muted);font-size:12px;word-break:break-all}

  /* Upcoming list */
  .ul{list-style:none;margin:0;padding:0}
  .ul li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .ul li:last-child{border:0}
  .ul .date{width:46px;height:46px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;line-height:1;flex-shrink:0}
  .ul .date small{font-size:10px;font-weight:600;opacity:.85;text-transform:uppercase}
  .ul .date b{font-size:18px}
  .ul .info{flex:1;min-width:0}
  .ul .info div{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ul .info small{color:var(--muted)}
  .ul .in{font-size:12px;color:var(--muted);white-space:nowrap}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(20,30,25,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;backdrop-filter:blur(2px)}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:640px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .18s ease}
  @keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal header{padding:20px 24px 0;display:flex;justify-content:space-between;align-items:center}
  .modal header h2{margin:0;font-size:20px}
  .modal .content{padding:18px 24px 24px}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .form .full{grid-column:1/-1}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
  .field textarea{min-height:90px;resize:vertical}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .swatches span{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:.12s}
  .swatches span.sel{border-color:#fff;box-shadow:0 0 0 2px var(--ink)}
  .emojis{display:flex;gap:6px;flex-wrap:wrap}
  .emojis span{font-size:22px;padding:4px 6px;border-radius:8px;cursor:pointer;border:2px solid transparent}
  .emojis span.sel{border-color:var(--brand);background:var(--brand-soft)}
  .modal footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
  .modal footer .left{margin-right:auto}

  .install-btn{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#dfeee6;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600}
  .install-btn:hover{background:rgba(255,255,255,.16);color:#fff}
  .install-btn.hidden{display:none}
  .install-steps{text-align:left;margin:16px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
  .install-steps li{display:flex;gap:12px;align-items:flex-start;background:#fafbfa;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5}
  .install-steps .num{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;display:grid;place-items:center;flex-shrink:0;font-size:13px}
  .install-steps svg{width:20px;height:20px;vertical-align:-4px;color:#2b64a8}
  .install-banner{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1d3b2e;color:#fff;border-radius:14px;padding:12px 14px 12px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 34px rgba(0,0,0,.3);z-index:45;max-width:calc(100vw - 32px);width:420px;animation:pop .25s ease}
  .install-banner img{width:44px;height:44px;border-radius:10px}
  .install-banner .t{flex:1;min-width:0}
  .install-banner .t b{display:block;font-size:14px}
  .install-banner .t small{color:#b9d4c5;font-size:12px}
  .install-banner .btn{padding:8px 12px}
  .install-banner .x{background:none;border:0;color:#b9d4c5;font-size:18px;padding:4px 6px;cursor:pointer}
  @media(display-mode:standalone){.install-btn,.install-banner{display:none!important}}
  .join-btn{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;background:rgba(242,163,58,.15);border:1px dashed rgba(242,163,58,.7);color:#ffd9a3;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600}
  .join-btn:hover{background:rgba(242,163,58,.28);color:#fff}
  .camp.locked .body{opacity:.55}
  .camp.locked .band{filter:saturate(.4)}
  .lock-tag{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.45);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;display:flex;align-items:center;gap:5px;backdrop-filter:blur(3px)}
  .lock-tag svg{width:12px;height:12px}
  .code-card{border:1px solid #f5d9a8;background:#fffaf1}
  .code-display{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:22px;font-weight:700;letter-spacing:2px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:center;cursor:pointer;user-select:all;color:var(--ink)}
  .code-display:hover{border-color:var(--brand);background:var(--brand-soft)}
  .code-display.big{font-size:28px;padding:18px}
  .code-input{width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:26px;font-weight:700;letter-spacing:3px;text-align:center;padding:16px;border:2px solid var(--line);border-radius:12px;outline:none}
  .code-input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
  .join-err{margin-top:10px;color:var(--danger);font-size:14px;text-align:center;font-weight:600}
  .shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  .group-tag{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;font-size:12px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:3px 9px;border-radius:99px;cursor:pointer}
  .group-tag:hover{background:#d3eadc}
  .group-strip{display:flex;gap:4px;flex-wrap:wrap}
  .group-strip span{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:15px}
  .group-strip .more{background:#eef1ef;color:var(--muted);font-size:11px;font-weight:700}
  .qr-wrap{display:inline-block;padding:10px;background:#fff;border:1px solid var(--line);border-radius:14px}
  .qr-wrap svg{width:260px;height:260px;display:block}
  .wl-pos{font-size:11.5px;color:#a86a12;margin-top:4px;cursor:pointer;font-weight:600}
  .wl-pos.first{color:var(--brand)}
  .wl-pos.joined{color:var(--brand);cursor:default}
  .wl-note{background:#fff8e6;border:1px solid #f5d9a8;color:#7a5410;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.5;margin-top:12px}
  .wl-note.first{background:var(--brand-soft);border-color:#b9dcc9;color:#1f5a3f}
  .nospots{min-height:70vh;display:flex;align-items:center;justify-content:center}
  .nospots-box{max-width:520px;width:100%;text-align:center;background:var(--panel);border-radius:20px;box-shadow:var(--shadow);padding:44px 36px;border-top:6px solid var(--danger)}
  .nospots-icon{font-size:56px;filter:grayscale(1);opacity:.6}
  .nospots-badge{display:inline-block;margin:12px 0 10px;background:#fdecea;color:var(--danger);font-weight:800;letter-spacing:2px;font-size:12px;padding:4px 12px;border-radius:99px}
  .nospots h1{font-size:24px;letter-spacing:.5px;color:var(--danger);margin:0 0 12px;line-height:1.3}
  .nospots .sub{font-size:15px;line-height:1.6;margin:0 0 26px}
  .nospots .btn{padding:12px 22px;font-size:15px}
  .draft-note{background:#fff8e6;border:1px solid #f5d9a8;color:#7a5410;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:14px}
  .draft-note a{color:#7a5410;font-weight:700}
  .trash{margin-top:28px;background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 20px}
  .trash summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:14px}
  .trash .ul{margin-top:8px}
  .trash .btn{margin-left:6px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1f2a24;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%)}

  .menu-btn{display:none}
  @media(max-width:820px){
    .sidebar{position:fixed;left:-260px;z-index:40;transition:.2s;height:100vh}
    .sidebar.open{left:0}
    main{padding:18px 16px 60px}
    .menu-btn{display:inline-flex}
    .form{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="logo">
    <svg viewBox="0 0 64 64" class="logo-mark">
  <rect width="64" height="64" rx="14" fill="#1d3b2e"/>
  <circle cx="49" cy="15" r="4.5" fill="#fff" opacity=".9"/>
  <circle cx="51" cy="13.5" r="3.6" fill="#1d3b2e"/>

  <path d="M27 53c0-5 5-8 5-8s5 3 5 8" fill="#f2a33a"/>
</svg>
    Campuser
  </div>
  <nav class="nav">
    <button data-view="dashboard" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</button>
    <button data-view="camps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 21h20L12 3Z"/><path d="M12 11 8 21h8l-4-10Z"/></svg>Camps</button>
    <button data-view="groups"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14"/><path d="M9 21v-5h6v5M9 10h.01M15 10h.01M9 13h.01M15 13h.01"/></svg>Groups</button>
    <button data-view="campers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.5A5 5 0 0 1 22 19"/></svg>Campers</button>
    <button data-view="schedule"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Schedule</button>
  </nav>
  <button class="join-btn" onclick="openJoinModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Join camp with code</button>
  <button class="install-btn" id="installBtn" onclick="installApp()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><span>Install app</span></button>
  <div class="spacer"></div>
  <div class="foot">
    <span id="saveBadge">Autosave on</span> · stored on this device
    <div><button onclick="exportData()">Export</button><button onclick="document.getElementById('importFile').click()">Import</button><button onclick="resetData()">Clear all</button></div>
    <input type="file" id="importFile" accept="application/json" hidden onchange="importData(this)">
  </div>
</aside>

<main id="main"></main>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

      var maxEcCount = 0;

      out.writeByte(0xff);
      out.writeByte(0xff);

      };

      };

      };

      };

      var utf8 = [];
      for (var i=0; i < str.length; i++) {
        var charcode = str.charCodeAt(i);
        if (charcode < 0x80) utf8.push(charcode);
        else if (charcode < 0x800) {
          utf8.push(0xc0 | (charcode >> 6),
              0x80 | (charcode & 0x3f));
        }

          utf8.push(0xe0 | (charcode >> 12),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));

        else {
          i++;

          // subtracting 0x10000 and splitting the

              0x80 | ((charcode>>6) & 0x3f),

      }

    }

/* ============ Routing ============ */
const STATE_KEY='campuser.lastView';
let state={view:'dashboard',campId:null,groupId:null,tab:'overview',q:'',filter:'all',sort:'start',groupFilter:'all'};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{go(b.dataset.view);$('#sidebar').classList.remove('open')});
function go(view,campId=null){if(view==='group'){state.groupId=campId;campId=null}if(view==='camp'){const c=DB.camps.find(x=>x.id===campId);if(c&&!hasAccess(c)){openJoinModal(c.id);return}}state.view=view;state.campId=campId;if(view==='camp')state.tab='overview';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view||(view==='camp'&&b.dataset.view==='camps')||(view==='group'&&b.dataset.view==='groups')));render();window.scrollTo(0,0)}
function updateTitle(){let t='Campuser';const v=state.view;if(v==='camp'){const c=DB.camps.find(x=>x.id===state.campId);if(c)t=`${c.emoji} ${c.name} · Campuser`}else if(v==='group'){const g=DB.groups.find(x=>x.id===state.groupId);if(g)t=`${g.emoji} ${g.name} · Campuser`}else if(v!=='dashboard')t={camps:'Camps',groups:'Groups',campers:'Campers',schedule:'Schedule',nospots:'No spots remaining'}[v]+' · Campuser';document.title=t}
function rememberView(){try{store.set(STATE_KEY,JSON.stringify({view:state.view,campId:state.campId,groupId:state.groupId,tab:state.tab,groupFilter:state.groupFilter}))}catch(e){}}
function restoreView(){try{const v=JSON.parse(store.get(STATE_KEY)||'null');if(!v)return;if(v.view==='group'&&DB.groups.some(g=>g.id===v.groupId)){state.view='group';state.groupId=v.groupId}else if(v.view==='camp'&&DB.camps.some(c=>c.id===v.campId&&hasAccess(c))){state.view='camp';state.campId=v.campId;state.tab=v.tab||'overview'}else if(['camps','groups','campers','schedule'].includes(v.view))state.view=v.view;if(v.groupFilter&&(v.groupFilter==='all'||v.groupFilter==='none'||DB.groups.some(g=>g.id===v.groupFilter)))state.groupFilter=v.groupFilter;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view||(state.view==='camp'&&b.dataset.view==='camps')||(state.view==='group'&&b.dataset.view==='groups')))}catch(e){}}
function render(){
  purgeOldTrash();updateTitle();rememberView();
  const m=$('#main');
  if(state.view==='dashboard')m.innerHTML=Dashboard();
  else if(state.view==='camps')m.innerHTML=Camps();
  else if(state.view==='campers')m.innerHTML=Campers();
  else if(state.view==='schedule')m.innerHTML=Schedule();
  else if(state.view==='camp')m.innerHTML=CampDetail();
  else if(state.view==='nospots')m.innerHTML=NoSpots();
  else if(state.view==='groups')m.innerHTML=Groups();
  else if(state.view==='group')m.innerHTML=GroupDetail();
  save();
}
const topbar=(title,sub,actions='')=>`<div class="topbar"><div style="display:flex;gap:12px;align-items:center"><button class="btn menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">${ICONS.menu}</button><div><h1>${title}</h1><p class="sub">${sub}</p></div></div><div style="display:flex;gap:8px">${actions}</div></div>`;

/* ============ Views ============ */
function Dashboard(){
  const cs=myCamps();const t=today();const locked=DB.camps.length-cs.length;
  const upcoming=cs.filter(c=>campStatus(c)==='upcoming').sort((a,b)=>a.start.localeCompare(b.start));
  const active=cs.filter(c=>campStatus(c)==='active');
  const totalCampers=cs.reduce((s,c)=>s+enrolled(c),0);
  const cap=cs.filter(c=>campStatus(c)!=='past').reduce((s,c)=>s+c.capacity,0);
  const fill=cs.filter(c=>campStatus(c)!=='past').reduce((s,c)=>s+enrolled(c),0);
  const revenue=cs.reduce((s,c)=>s+enrolled(c)*(c.price||0),0);
  const todos=cs.flatMap(c=>c.checklist.filter(x=>!x.done).map(x=>({...x,camp:c}))).slice(0,8);
  const greet=new Date().getHours()<12?'Good morning':new Date().getHours()<18?'Good afternoon':'Good evening';
  return topbar(`${greet} 👋`,`Here's what's happening across your camps.${locked?` ${locked} locked camp${locked===1?'':'s'} on this device — join with a code.`:''}`,`<button class="btn" onclick="openJoinModal()">${ICONS.lock} Join camp</button><button class="btn primary" onclick="openCampForm()">${ICONS.plus} New camp</button>`)+
  `<div class="stats">
    <div class="stat"><div class="ic">${ICONS.tent}</div><div><div class="v">${cs.length}</div><div class="l">Your camps · ${active.length} running now</div></div></div>
    <div class="stat"><div class="ic">${ICONS.users}</div><div><div class="v">${totalCampers}</div><div class="l">Campers enrolled</div></div></div>
    <div class="stat"><div class="ic">${ICONS.fire}</div><div><div class="v">${cap?Math.round(fill/cap*100):0}%</div><div class="l">Capacity filled (${fill}/${cap})</div></div></div>
    <div class="stat"><div class="ic">${ICONS.dollar}</div><div><div class="v">${money(revenue)}</div><div class="l">Projected revenue</div></div></div>
  </div>
  <div class="grid2">
    <div class="card"><h2>Upcoming & active camps</h2>
      ${(active.concat(upcoming)).length?`<ul class="ul">${active.concat(upcoming).map(c=>{const d=daysUntil(c.start);return`<li onclick="go('camp','${c.id}')"><div class="date" style="background:${c.color}"><small>${fmtShort(c.start).split(' ')[0]}</small><b>${fmtShort(c.start).split(' ')[1]}</b></div><div class="info"><div>${c.emoji} ${esc(c.name)}</div><small>${esc(c.location)} · ${enrolled(c)}/${c.capacity} campers</small></div><span class="in">${d<0?'In progress':d===0?'Starts today':`in ${d} day${d===1?'':'s'}`}</span></li>`}).join('')}</ul>`:
      `<div class="empty"><div class="big">🏕️</div><p>No upcoming camps yet.</p><button class="btn primary" onclick="openCampForm()">Create your first camp</button></div>`}
    </div>
    <div>
      <div class="card" style="margin-bottom:20px"><h2>Open to-dos</h2>
        ${todos.length?`<div class="checklist">${todos.map(x=>`<label><input type="checkbox" onchange="toggleCheck('${x.camp.id}','${x.id}')"><span>${esc(x.text)} <small style="color:var(--muted)">· ${esc(x.camp.name)}</small></span></label>`).join('')}</div>`:`<p class="sub">All caught up! 🎉</p>`}
      </div>
      ${DB.groups.length?`<div class="card" style="margin-bottom:20px"><h2>Your groups</h2><ul class="ul">${DB.groups.map(g=>`<li onclick="go('group','${g.id}')"><div class="date" style="background:${g.color};font-size:22px">${g.emoji}</div><div class="info"><div>${esc(g.name)}</div><small>${groupCamps(g).length} camp${groupCamps(g).length===1?'':'s'} · ${groupCamps(g).reduce((s,c)=>s+enrolled(c),0)} campers</small></div></li>`).join('')}</ul></div>`:''}
      <div class="card"><h2>Quick actions</h2>
        <div style="display:flex;flex-direction:column;gap:8px">
          <button class="btn" onclick="openCampForm()">${ICONS.plus} Create a camp</button>
          <button class="btn" onclick="openGroupForm()">${ICONS.building} Create a business / group</button>
          <button class="btn" onclick="openJoinModal()">${ICONS.lock} Join a camp with a code</button>
          <button class="btn" onclick="go('campers')">${ICONS.users} Browse all campers</button>
          <button class="btn" onclick="go('schedule')">${ICONS.cal} View schedule</button>
        </div>
      </div>
    </div>
  </div>`;
}

function Camps(){
  let list=DB.camps.filter(c=>{
    const q=state.q.toLowerCase();
    const okQ=!q||c.name.toLowerCase().includes(q)||c.location.toLowerCase().includes(q)||c.type.toLowerCase().includes(q);
    const okF=state.filter==='all'||campStatus(c)===state.filter;
    const okG=state.groupFilter==='all'||(state.groupFilter==='none'?!c.groupId:c.groupId===state.groupFilter);
    return okQ&&okF&&okG;
  });
  list.sort((a,b)=>state.sort==='name'?a.name.localeCompare(b.name):state.sort==='fill'?(enrolled(b)/b.capacity)-(enrolled(a)/a.capacity):a.start.localeCompare(b.start));
  const nLocked=DB.camps.filter(c=>!hasAccess(c)).length;
  return topbar('Camps',`${myCamps().length} camp${myCamps().length===1?'':'s'} you can access${nLocked?` · ${nLocked} locked`:''}`,`<button class="btn" onclick="openJoinModal()">${ICONS.lock} Join camp</button><button class="btn primary" onclick="openCampForm()">${ICONS.plus} New camp</button>`)+
  `<div class="toolbar">
    <div class="search">${ICONS.search}<input placeholder="Search camps by name, location or type…" value="${esc(state.q)}" oninput="state.q=this.value;renderKeepFocus(this)"></div>
    <select onchange="state.filter=this.value;render()">${['all','active','upcoming','past','draft'].map(f=>`<option value="${f}" ${state.filter===f?'selected':''}>${f==='all'?'All statuses':f[0].toUpperCase()+f.slice(1)}</option>`).join('')}</select>
    ${DB.groups.length?`<select onchange="state.groupFilter=this.value;render()"><option value="all" ${state.groupFilter==='all'?'selected':''}>All groups</option>${DB.groups.map(g=>`<option value="${g.id}" ${state.groupFilter===g.id?'selected':''}>${g.emoji} ${esc(g.name)}</option>`).join('')}<option value="none" ${state.groupFilter==='none'?'selected':''}>Independent camps</option></select>`:''}
    <select onchange="state.sort=this.value;render()"><option value="start" ${state.sort==='start'?'selected':''}>Sort: Start date</option><option value="name" ${state.sort==='name'?'selected':''}>Sort: Name</option><option value="fill" ${state.sort==='fill'?'selected':''}>Sort: Fill rate</option></select>
  </div>
  ${list.length?`<div class="camps">${list.map(CampCard).join('')}</div>`:`<div class="empty"><div class="big">🔍</div><p>${DB.camps.length?'No camps match. Try another search, or create a new one.':'No camps yet — create your first one.'}</p><button class="btn primary" onclick="openCampForm()">${ICONS.plus} New camp</button></div>`}
  ${DB.trash.length?`<details class="trash"><summary>🗑️ Recently deleted (${DB.trash.length})</summary><ul class="ul">${DB.trash.map(c=>`<li style="cursor:default"><div class="date" style="background:${c.color}"><small>${fmtShort(c.start).split(' ')[0]}</small><b>${fmtShort(c.start).split(' ')[1]}</b></div><div class="info"><div>${c.emoji} ${esc(c.name)}</div><small>Deleted ${fmt(c.deletedAt.slice(0,10))} · ${c.campers.length} campers</small></div><button class="btn sm" onclick="restoreCamp('${c.id}')">Restore</button><button class="btn sm danger" onclick="purgeCamp('${c.id}')">Delete forever</button></li>`).join('')}</ul></details>`:''}`;
}
function renderKeepFocus(el){const pos=el.selectionStart;render();const n=$('.search input');if(n){n.focus();n.setSelectionRange(pos,pos)}}
function CampCard(c){
  const e=enrolled(c),pct=Math.min(100,Math.round(e/c.capacity*100)),st=campStatus(c),locked=!hasAccess(c);
  return`<div class="camp ${locked?'locked':''}" onclick="go('camp','${c.id}')">
    <div class="band" style="background:linear-gradient(135deg,${c.color},${c.color}bb)"><span class="emoji">${c.emoji}</span>${locked?`<span class="lock-tag">${ICONS.lock} Code required</span>`:''}</div>
    <div class="body">
      <div class="name"><span>${esc(c.name)}</span><span class="pill ${st}">${st}</span></div>
      ${groupOf(c)?`<div class="group-tag" onclick="event.stopPropagation();go('group','${c.groupId}')">${groupOf(c).emoji} ${esc(groupOf(c).name)}</div>`:''}
      <div class="meta">${ICONS.pin}${esc(c.location)}</div>
      <div class="meta">${ICONS.cal}${fmt(c.start)} – ${fmt(c.end)} · ${days(c)}d</div>
      <div class="meta"><span>${esc(c.type)}</span>·<span>Ages ${c.ageMin}–${c.ageMax}</span>·<span>${money(c.price)}</span></div>
      <div style="margin-top:auto;padding-top:6px"><div class="progress"><i class="${pct>=100?'full':''}" style="width:${pct}%"></i></div><div class="cap"><span>${e} enrolled${waitlisted(c)?` · ${waitlisted(c)}${waitMax(c)!=null?`/${waitMax(c)}`:''} waitlisted`:''}</span><span>${c.capacity-e>0?`${c.capacity-e} spots left`:'Full'}</span></div></div>
    </div></div>`;
}

function Campers(){
  const q=state.q.toLowerCase();
  const rows=myCamps().flatMap(c=>c.campers.map(p=>({p,c}))).filter(({p,c})=>!q||p.name.toLowerCase().includes(q)||(p.guardian||'').toLowerCase().includes(q)||c.name.toLowerCase().includes(q)).sort((a,b)=>a.p.name.localeCompare(b.p.name));
  return topbar('Campers',`${rows.length} registration${rows.length===1?'':'s'} across all camps`)+
  `<div class="toolbar"><div class="search">${ICONS.search}<input placeholder="Search campers, guardians or camps…" value="${esc(state.q)}" oninput="state.q=this.value;renderKeepFocus(this)"></div></div>
  <div class="card" style="padding:6px 10px">${rows.length?`<table><thead><tr><th>Camper</th><th>Age</th><th>Camp</th><th>Guardian</th><th>Contact</th><th>Status</th><th></th></tr></thead><tbody>
  ${rows.map(({p,c})=>`<tr><td><span class="avatar" style="background:${avColor(p.name)}">${initials(p.name)}</span><b>${esc(p.name)}</b>${p.notes?`<div style="font-size:12px;color:var(--muted);margin-left:42px">${esc(p.notes)}</div>`:''}</td><td>${p.age||'—'}</td><td><a href="#" onclick="event.preventDefault();go('camp','${c.id}')">${c.emoji} ${esc(c.name)}</a></td><td>${esc(p.guardian)||'—'}</td><td>${esc(p.contact)||'—'}</td><td><select class="status-sel" onchange="setStatus('${c.id}','${p.id}',this.value)">${STATUSES.map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select>${p.status==='Waitlisted'?`<div class="wl-pos ${waitPos(c,p)===1?'first':''}" onclick="showWaitlistModal('${c.id}','${p.id}')">#${waitPos(c,p)} in line${waitPos(c,p)===1?' · joins when a spot opens':''}</div>`:p.promotedAt?`<div class="wl-pos joined">✓ joined from waitlist</div>`:''}</td><td><button class="icon-btn" title="Edit" onclick="openCamperForm('${c.id}','${p.id}')">${ICONS.edit}</button></td></tr>`).join('')}
  </tbody></table>`:`<div class="empty" style="margin:10px"><div class="big">🧒</div><p>No campers found.</p></div>`}</div>`;
}

function Schedule(){
  const cs=myCamps().filter(c=>c.published).sort((a,b)=>a.start.localeCompare(b.start));
  if(!cs.length)return topbar('Schedule','Timeline of all published camps')+`<div class="empty"><div class="big">📅</div><p>No published camps yet.</p></div>`;
  const min=cs[0].start,max=cs.reduce((m,c)=>c.end>m?c.end:m,cs[0].end);
  const span=Math.max(1,(new Date(max)-new Date(min))/86400000+1);
  const months=[];let d=new Date(min+'T00:00:00');d.setDate(1);while(d<=new Date(max+'T00:00:00')){months.push(new Date(d));d.setMonth(d.getMonth()+1)}
  const pos=x=>Math.max(0,((new Date(x+'T00:00:00')-new Date(min+'T00:00:00'))/86400000)/span*100);
  const tPos=pos(today());
  return topbar('Schedule',`${fmt(min)} – ${fmt(max)}`)+
  `<div class="card" style="overflow-x:auto"><div style="min-width:700px">
    <div style="position:relative;height:22px;border-bottom:1px solid var(--line);margin-bottom:8px;font-size:12px;color:var(--muted)">${months.map(m=>`<span style="position:absolute;left:${pos(m.toISOString().slice(0,10))}%">${m.toLocaleDateString(undefined,{month:'short',year:'numeric'})}</span>`).join('')}</div>
    <div style="position:relative">
      ${tPos>=0&&tPos<=100?`<div style="position:absolute;left:${tPos}%;top:0;bottom:0;border-left:2px dashed var(--accent);z-index:1"></div><span style="position:absolute;left:${tPos}%;top:-4px;transform:translateX(-50%);font-size:10px;background:var(--accent);color:#fff;padding:1px 6px;border-radius:99px;z-index:2">Today</span>`:''}
      ${cs.map(c=>{const l=pos(c.start),w=Math.max(1.5,(days(c)/span)*100);return`<div style="display:flex;align-items:center;gap:12px;height:44px"><div style="width:180px;flex-shrink:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.emoji} ${esc(c.name)}</div><div style="flex:1;position:relative;height:28px"><div onclick="go('camp','${c.id}')" title="${esc(c.name)}: ${fmt(c.start)} – ${fmt(c.end)}" style="position:absolute;left:${l}%;width:${w}%;top:0;height:28px;background:${c.color};border-radius:8px;cursor:pointer;color:#fff;font-size:12px;line-height:28px;padding:0 8px;white-space:nowrap;overflow:hidden">${fmtShort(c.start)} · ${enrolled(c)}/${c.capacity}</div></div></div>`}).join('')}
    </div></div></div>
  <h2 style="font-size:17px;margin:26px 0 12px">All activities by date</h2>
  ${(()=>{const items=cs.flatMap(c=>c.activities.map(a=>({...a,camp:c,date:addDays(c.start,a.day-1)}))).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));if(!items.length)return`<p class="sub">No activities scheduled yet. Open a camp → Schedule tab to add some.</p>`;
    const byDate={};items.forEach(i=>(byDate[i.date]=byDate[i.date]||[]).push(i));
    return Object.keys(byDate).map(d=>`<div class="day"><h3>${fmt(d)}${d===today()?' · Today':''}</h3>${byDate[d].map(a=>`<div class="act"><span class="t">${a.time}</span><span class="n">${esc(a.title)}<small>${a.camp.emoji} ${esc(a.camp.name)}</small></span>${a.location?`<span class="loc">${esc(a.location)}</span>`:''}</div>`).join('')}</div>`).join('')})()}`;
}

function Groups(){
  const q=state.q.toLowerCase();
  const list=DB.groups.filter(g=>!q||g.name.toLowerCase().includes(q)||(g.description||'').toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  return topbar('Businesses & camp groups',`${DB.groups.length} group${DB.groups.length===1?'':'s'} · organize camps under one organization`,`<button class="btn primary" onclick="openGroupForm()">${ICONS.plus} New group</button>`)+
  `<div class="toolbar"><div class="search">${ICONS.search}<input placeholder="Search groups…" value="${esc(state.q)}" oninput="state.q=this.value;renderKeepFocus(this)"></div></div>
  ${list.length?`<div class="camps">${list.map(GroupCard).join('')}</div>`:`<div class="empty"><div class="big">🏢</div><p>${DB.groups.length?'No groups match your search.':'No groups yet. Create a business or camp group, then add camps to it — like "Sunny Days Youth Org" with its summer, spring and sports camps.'}</p><button class="btn primary" onclick="openGroupForm()">${ICONS.plus} Create your first group</button></div>`}
  ${DB.groupTrash.length?`<details class="trash"><summary>🗑️ Recently deleted groups (${DB.groupTrash.length})</summary><ul class="ul">${DB.groupTrash.map(g=>`<li style="cursor:default"><div class="date" style="background:${g.color};font-size:22px">${g.emoji}</div><div class="info"><div>${esc(g.name)}</div><small>Deleted ${fmt(g.deletedAt.slice(0,10))} · remembers ${(g.memberIds||[]).length} camp${(g.memberIds||[]).length===1?'':'s'}</small></div><button class="btn sm" onclick="restoreGroup('${g.id}')">Restore</button><button class="btn sm danger" onclick="purgeGroup('${g.id}')">Delete forever</button></li>`).join('')}</ul></details>`:''}`;
}
function GroupCard(g){
  const cs=groupCamps(g),mine=cs.filter(hasAccess),camp=cs.reduce((s,c)=>s+enrolled(c),0),cap=cs.reduce((s,c)=>s+c.capacity,0),active=cs.filter(c=>campStatus(c)==='active').length,up=cs.filter(c=>campStatus(c)==='upcoming').length;
  return`<div class="camp" onclick="go('group','${g.id}')">

function saveGroup(e,id){e.preventDefault();const o=Object.fromEntries(new FormData(e.target).entries());const d={name:o.name.trim(),emoji:o.emoji,color:o.color,description:o.description.trim(),website:o.website.trim(),contact:o.contact.trim()};

function deleteGroup(id){const g=DB.groups.find(x=>x.id===id);const n=groupCamps(g).length;if(!confirm(`Move "${g.name}" to Recently deleted?${n?` Its ${n} camp${n>1?'s':''} will be kept and become independent — restoring the group puts them back.`:''} You can restore it for 30 days.`))return;

function restoreGroup(id){const g=DB.groupTrash.find(x=>x.id===id);DB.groupTrash=DB.groupTrash.filter(x=>x.id!==id);const ids=g.memberIds||[];delete g.deletedAt;delete g.memberIds;DB.groups.push(g);DB.camps.forEach(c=>{if(ids.includes(c.id)){c.groupId=g.id;delete c._ungrouped}});if(GROUPMEM[g.id])delete GROUPMEM[g.id].deletedAt;toast(`Group restored with ${ids.length} camp${ids.length===1?'':'s'}`);go('group',g.id)}

    <div class="actions"><button class="btn" onclick="showQRModal('${c.id}')">${ICONS.qr} QR code</button><button class="btn" onclick="showCodeModal('${c.id}')">${ICONS.lock} Invite code</button><button class="btn" onclick="togglePublish('${c.id}')">${c.published?'Unpublish':'Publish'}</button><button class="btn" onclick="duplicateCamp('${c.id}')">Duplicate</button><button class="btn" onclick="openCampForm('${c.id}')">${ICONS.edit} Edit</button><button class="btn" onclick="deleteCamp('${c.id}')">${ICONS.trash}</button></div>
  </div>
  <div class="tabs">${tabs.map(([k,l,n])=>`<button class="${state.tab===k?'active':''}" onclick="state.tab='${k}';render()">${l}${n!=null?`<span class="n">${n}</span>`:''}</button>`).join('')}</div>${body}`;
}

/* ============ Modals & forms ============ */
let modalInitial='';
function formSnapshot(){const f=$('#modal form');if(!f)return'';const fd=new FormData(f);return JSON.stringify([...fd.entries()])}
function modalDirty(){return !!$('#modal form')&&formSnapshot()!==modalInitial}
function openModal(html){$('#modal').innerHTML=html;$('#overlay').classList.add('open');modalInitial=formSnapshot();const f=$('#modal input:not([type=hidden]),#modal select');if(f)setTimeout(()=>f.focus(),50)}
function closeModal(force){
  if(!$('#overlay').classList.contains('open'))return;
  if(!force&&modalDirty()&&!$('#campForm')&&!confirm('Discard your unsaved changes?'))return;
  if($('#campForm')&&!force){/* camp form: keep a draft so nothing is lost */saveDraft()}
  $('#overlay').classList.remove('open');$('#modal').innerHTML='';
}
// Clicking the dim background never closes the dialog (prevents accidental exits while dragging/selecting).
// Only the ✕ button, Cancel, or Escape do — and Escape asks first if you've typed something.
$('#overlay').addEventListener('mousedown',e=>{if(e.target.id==='overlay'){const m=$('#modal');m.style.transform='scale(1.015)';setTimeout(()=>m.style.transform='',120)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#overlay').classList.contains('open')){if(modalDirty()&&!confirm('Close this form? Your typed values will be kept as a draft.'))return;closeModal()}});
// Draft memory for the camp form
function saveDraft(){const f=$('#campForm');if(!f||f.dataset.editing)return;const o=Object.fromEntries(new FormData(f).entries());o.published=f.elements.namedItem('published').checked;o._manual=f.elements.namedItem('emoji').dataset.manual||'';if(!o.name&&!o.description&&!o.location){return}store.set(DRAFT_KEY,JSON.stringify(o))}
function clearDraft(){store.del(DRAFT_KEY)}
function getDraft(){try{return JSON.parse(store.get(DRAFT_KEY))}catch(e){return null}}
function discardDraft(){clearDraft();closeModal(true);openCampForm();toast('Draft discarded')}
const field=(label,inner,full=false)=>`<div class="field ${full?'full':''}"><label>${label}</label>${inner}</div>`;
const modalHeader=t=>`<header><h2>${t}</h2><button class="icon-btn" onclick="closeModal()" style="font-size:20px">✕</button></header>`;

function openCampForm(id,presetGroup){
  const draft=!id?getDraft():null;if(draft&&presetGroup)draft.groupId=presetGroup;
  const c=id?DB.camps.find(x=>x.id===id):Object.assign({name:'',type:'Summer Camp',location:'',start:addDays(today(),14),end:addDays(today(),18),capacity:30,waitlistMax:null,price:0,ageMin:8,ageMax:14,color:COLORS[0],emoji:'🏕️',description:'',published:true,groupId:presetGroup||null},draft||{});
  if(draft&&draft.waitlistMax==='')c.waitlistMax=null;
  openModal(modalHeader(id?'Edit camp':'Create a new camp')+`<form class="content" id="campForm" ${id?'data-editing="1"':''} oninput="scheduleDraft()" onchange="scheduleDraft()" onsubmit="saveCamp(event,'${id||''}')">
    ${draft?`<div class="draft-note">📝 Restored your unsaved draft. <a href="#" onclick="event.preventDefault();discardDraft()">Start fresh</a></div>`:''}
    <input type="hidden" name="color" value="${c.color}"><input type="hidden" name="emoji" value="${c.emoji}" data-manual="${id||(draft&&draft._manual)?'1':''}">
    <div class="form">
      ${field('Camp name',`<input name="name" required placeholder="e.g. Pine Ridge Summer Camp" value="${esc(c.name)}" oninput="autoEmoji()">`,true)}
      ${field('Type',`<select name="type" onchange="autoEmoji()">${TYPES.map(t=>`<option ${c.type===t?'selected':''}>${t}</option>`).join('')}</select>`)}
      ${field('Business / camp group',`<select name="groupId"><option value="">— Independent (no group) —</option>${DB.groups.map(g=>`<option value="${g.id}" ${(c.groupId||'')===g.id?'selected':''}>${g.emoji} ${esc(g.name)}</option>`).join('')}</select>`)}
      ${field('Location',`<input name="location" placeholder="City or venue" value="${esc(c.location)}">`)}
      ${field('Start date',`<input type="date" name="start" required value="${c.start}">`)}
      ${field('End date',`<input type="date" name="end" required value="${c.end}">`)}
      ${field('Capacity',`<input type="number" name="capacity" min="1" required value="${c.capacity}">`)}
      ${field('Max waitlist size',`<input type="number" name="waitlistMax" min="0" placeholder="Unlimited" value="${c.waitlistMax==null?'':c.waitlistMax}">`)}
      ${field('Price per camper ($)',`<input type="number" name="price" min="0" step="1" value="${c.price}">`)}
      ${field('Min age',`<input type="number" name="ageMin" min="0" value="${c.ageMin}">`)}
      ${field('Max age',`<input type="number" name="ageMax" min="0" value="${c.ageMax}">`)}
      ${field('Icon <span id="emojiHint" style="font-weight:500;text-transform:none;letter-spacing:0">· auto-picked from the name — click to override</span>',`<div class="emojis" id="emojiPicker">${EMOJIS.map(e=>`<span class="${c.emoji===e?'sel':''}" onclick="pick(this,'emoji','${e}')">${e}</span>`).join('')}</div>`,true)}
      ${field('Color',`<div class="swatches">${COLORS.map(k=>`<span class="${c.color===k?'sel':''}" style="background:${k}" onclick="pick(this,'color','${k}')"></span>`).join('')}</div>`,true)}
      ${field('Description',`<textarea name="description" placeholder="What makes this camp special?">${esc(c.description)}</textarea>`,true)}
      <div class="field full"><label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:14px;color:var(--ink)"><input type="checkbox" name="published" ${c.published?'checked':''} style="width:16px;height:16px;accent-color:var(--brand)">Published (visible on schedule and open for registration)</label></div>
    </div>
    <footer>${!id?`<span class="left sub" style="align-self:center">Draft saves automatically</span>`:''}<button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">${id?'Save changes':'Create camp'}</button></footer></form>`);
}
function scheduleDraft(){clearTimeout(scheduleDraft._t);scheduleDraft._t=setTimeout(saveDraft,300)}
function pick(el,name,val){el.parentElement.querySelectorAll('span').forEach(s=>s.classList.remove('sel'));el.classList.add('sel');const h=$(`#campForm [name=${name}]`);h.value=val;if(name==='emoji'){h.dataset.manual='1';const hint=$('#emojiHint');if(hint)hint.innerHTML='· custom &nbsp;<a href="#" onclick="event.preventDefault();$(\'#campForm [name=emoji]\').dataset.manual=\'\';autoEmoji()">use auto</a>'}}
function autoEmoji(){const f=$('#campForm');if(!f)return;const h=f.querySelector('[name=emoji]');if(h.dataset.manual)return;const e=suggestEmoji(f.elements.namedItem('name').value,f.elements.namedItem('type').value);h.value=e;f.querySelectorAll('#emojiPicker span').forEach(s=>s.classList.toggle('sel',s.textContent===e));const hint=$('#emojiHint');if(hint)hint.textContent='· auto-picked from the name — click to override'}
function saveCamp(e,id){
  e.preventDefault();const f=new FormData(e.target);const o=Object.fromEntries(f.entries());
  if(o.end<o.start){toast('End date must be after start date');return}
  const data={name:o.name.trim(),type:o.type,groupId:o.groupId||null,_ungrouped:!o.groupId,location:o.location.trim()||'TBD',start:o.start,end:o.end,capacity:+o.capacity||1,waitlistMax:o.waitlistMax===''?null:Math.max(0,+o.waitlistMax||0),price:+o.price||0,ageMin:+o.ageMin||0,ageMax:+o.ageMax||0,color:o.color,emoji:o.emoji,description:o.description.trim(),published:f.has('published')};
  if(id){const c=DB.camps.find(x=>x.id===id);Object.assign(c,data);const n=promoteWaitlist(c);toast(n?`Camp updated · ${n} camper${n>1?'s':''} joined from the waitlist`:'Camp updated');closeModal(true);render()}
  else{const c={id:uid(),...data,code:genCode(allCodes()),campers:[],staff:[],activities:[],checklist:[],announcements:[]};DB.camps.push(c);grantAccess(c);clearDraft();closeModal(true);save();copyText(fmtCode(c.code)).then(ok=>showCreatedModal(c.id,ok))}
}
function copyText(txt){return (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>true).catch(()=>{try{const t=document.createElement('textarea');t.value=txt;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();return ok}catch(e){return false}})}
function copyCode(id){const c=DB.camps.find(x=>x.id===id);copyText(fmtCode(c.code)).then(ok=>toast(ok?'Code copied to clipboard':'Could not copy — select the code manually'))}
function lockCamp(id){const c=DB.camps.find(x=>x.id===id);if(!confirm(`Lock "${c.name}" on this device? You'll need the 16-digit code to open it again.`))return;revokeAccess(c);toast('Camp locked');go('camps')}
function showCreatedModal(id,copied){const c=DB.camps.find(x=>x.id===id);
  openModal(modalHeader('Camp created 🎉')+`<div class="content" style="text-align:center">
    <div style="font-size:48px">${c.emoji}</div><h3 style="margin:6px 0 2px;font-size:20px">${esc(c.name)}</h3><p class="sub" style="margin:0 0 18px">Here's the access code for your Campusers</p>
    <div class="code-display big" onclick="copyCode('${c.id}')" title="Click to copy">${fmtCode(c.code)}</div>
    <p class="sub" style="margin:10px 0 0">${copied?'✅ Copied to your clipboard.':'Click the code to copy it.'} Anyone who enters this code under <b>Join camp</b> gets access. You can always find it on the camp's Overview.</p>
    <footer style="justify-content:center"><button class="btn" onclick="copyCode('${c.id}')">📋 Copy again</button><button class="btn primary" onclick="closeModal(true);go('camp','${c.id}')">Open camp →</button></footer></div>`)}
function showQRModal(id){const c=DB.camps.find(x=>x.id===id);const url=joinURL(c);const {svg}=makeQR(url,8,3);
  openModal(modalHeader(`${ICONS.qr} QR code · ${esc(c.name)}`)+`<div class="content" style="text-align:center">
    <div class="qr-wrap" id="qrWrap">${svg}</div>
    <div class="code-display" style="margin:14px auto 6px;max-width:340px" onclick="copyCode('${c.id}')" title="Click to copy">${fmtCode(c.code)}</div>
    <p class="sub" style="margin:0 0 6px">Scan to open Campuser with this camp's code pre-filled — the camper just taps <b>Join camp</b>.</p>
    <p class="sub" style="margin:0;font-size:12px;word-break:break-all">${esc(url)}</p>
    ${!isHosted()?`<div class="draft-note" style="margin-top:14px;text-align:left">⚠️ You're running Campuser locally (${esc(location.hostname||'file')}). The QR link will only work for other people once the site is published (e.g. on GitHub Pages). The code itself works anywhere.</div>`:''}
    <footer style="justify-content:center;flex-wrap:wrap"><button class="btn" onclick="copyText(${JSON.stringify(url)}).then(ok=>toast(ok?'Link copied':'Could not copy'))">🔗 Copy link</button><button class="btn" onclick="downloadQR('${c.id}')">⬇️ Download PNG</button><button class="btn" onclick="printQR('${c.id}')">🖨️ Print poster</button><button class="btn primary" onclick="closeModal(true)">Done</button></footer></div>`)}
function downloadQR(id){const c=DB.camps.find(x=>x.id===id);const {svg,size}=makeQR(joinURL(c),10,4);const img=new Image();const blob=new Blob([svg],{type:'image/svg+xml'});const u=URL.createObjectURL(blob);
  img.onload=()=>{const cv=document.createElement('canvas');cv.width=size;cv.height=size+70;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(img,0,0);x.fillStyle='#1f2a24';x.font='bold 22px monospace';x.textAlign='center';x.fillText(fmtCode(c.code),size/2,size+18);x.font='16px sans-serif';x.fillStyle='#6b7a72';x.fillText(c.name,size/2,size+48);
    const a=document.createElement('a');a.download=`${c.name.replace(/[^\w]+/g,'-')}-qr.png`;a.href=cv.toDataURL('image/png');a.click();URL.revokeObjectURL(u);toast('QR code downloaded')};img.src=u}
function printQR(id){const c=DB.camps.find(x=>x.id===id);const {svg}=makeQR(joinURL(c),10,4);const w=window.open('','_blank');if(!w){toast('Pop-up blocked — allow pop-ups to print');return}
  w.document.write(`<!DOCTYPE html><html><head><title>${esc(c.name)} — Join</title><style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:40px;color:#1f2a24}h1{font-size:34px;margin:0 0 4px}p{color:#6b7a72;margin:4px 0 24px}svg{width:min(70vw,480px);height:auto}.code{font-family:monospace;font-size:30px;font-weight:700;letter-spacing:3px;margin-top:20px}.s{font-size:14px;color:#6b7a72;margin-top:10px;word-break:break-all}.b{display:inline-block;background:${c.color};color:#fff;padding:6px 16px;border-radius:99px;font-weight:700;margin-bottom:16px}</style></head><body><div class="b">Campuser</div><h1>${c.emoji} ${esc(c.name)}</h1><p>${esc(c.location)} · ${fmt(c.start)} – ${fmt(c.end)}</p>${svg}<div class="code">${fmtCode(c.code)}</div><div class="s">Scan the QR code, or open ${esc(location.origin+location.pathname)} and tap <b>Join camp</b> to enter the code.</div></body></html>`);w.document.close();setTimeout(()=>{try{w.focus();w.print()}catch(e){}},300)}
function showCodeModal(id){const c=DB.camps.find(x=>x.id===id);openModal(modalHeader('Invite code')+`<div class="content" style="text-align:center"><p class="sub" style="margin:0 0 14px">Share this code so others can join <b>${esc(c.name)}</b>.</p><div class="code-display big" onclick="copyCode('${c.id}')" title="Click to copy">${fmtCode(c.code)}</div><footer style="justify-content:center"><button class="btn primary" onclick="copyCode('${c.id}')">📋 Copy code</button><button class="btn" onclick="closeModal(true)">Done</button></footer></div>`)}

/* ---- Join camp ---- */
function openJoinModal(campId){const c=campId?DB.camps.find(x=>x.id===campId):null;
  openModal(modalHeader(c?`Unlock ${esc(c.emoji+' '+c.name)}`:'Join a camp')+`<form class="content" onsubmit="joinCamp(event)" autocomplete="off">
    <p class="sub" style="margin:0 0 14px">${c?'This camp is locked on this device.':'Ask the camp organizer for their access code.'} Enter the <b>16-digit code</b> to continue.</p>
    <input class="code-input" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="0000-0000-0000-0000" maxlength="19" oninput="fmtCodeInput(this)" onpaste="setTimeout(()=>fmtCodeInput(this),0)" required>
    <div id="joinErr" class="join-err" hidden></div>
    <footer><button type="button" class="btn" onclick="closeModal(true)">Cancel</button><button class="btn primary" id="joinBtn" disabled>Join camp</button></footer></form>`)}
function fmtCodeInput(el){const digits=cleanCode(el.value).slice(0,16);el.value=fmtCode(digits);el.setSelectionRange(el.value.length,el.value.length);const b=$('#joinBtn');if(b)b.disabled=digits.length!==16;const err=$('#joinErr');if(err)err.hidden=true}
function joinCamp(e){e.preventDefault();const el=e.target.querySelector('.code-input');const code=cleanCode(el.value);const err=$('#joinErr');
  if(code.length!==16){err.textContent='Please enter all 16 digits.';err.hidden=false;return}
  const c=campByCode(code);
  if(!c){err.textContent='No camp found with that code. Double-check the digits and try again.';err.hidden=false;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');return}
  if(hasAccess(c)){closeModal(true);toast('You already have access');go('camp',c.id);return}
  if(campFull(c)){closeModal(true);state.view='nospots';state.campId=c.id;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));render();window.scrollTo(0,0);return}
  grantAccess(c);closeModal(true);toast(`Welcome to ${c.name}! 🎉`);go('camp',c.id)}

function deleteCamp(id){const c=DB.camps.find(x=>x.id===id);if(!confirm(`Move "${c.name}" to Recently deleted? You can restore it for 30 days.`))return;DB.camps=DB.camps.filter(x=>x.id!==id);c.deletedAt=new Date().toISOString();DB.trash.unshift(c);toast('Camp moved to Recently deleted');go('camps')}
function restoreCamp(id){const c=DB.trash.find(x=>x.id===id);DB.trash=DB.trash.filter(x=>x.id!==id);delete c.deletedAt;if(c.groupId&&!DB.groups.some(g=>g.id===c.groupId))c.groupId=null;DB.camps.push(c);toast('Camp restored');go('camp',id)}
function purgeCamp(id){if(!confirm('Permanently delete this camp? This cannot be undone.'))return;DB.trash=DB.trash.filter(x=>x.id!==id);render()}
function purgeOldTrash(){const cutoff=Date.now()-30*86400000;DB.trash=(DB.trash||[]).filter(c=>new Date(c.deletedAt).getTime()>cutoff);DB.groupTrash=(DB.groupTrash||[]).filter(g=>new Date(g.deletedAt).getTime()>cutoff)}
function duplicateCamp(id){const c=DB.camps.find(x=>x.id===id);const n=JSON.parse(JSON.stringify(c));n.id=uid();n.code=genCode(allCodes());grantAccess(n);n.name=c.name+' (copy)';n.campers=[];n.published=false;n.activities.forEach(a=>a.id=uid());n.staff.forEach(a=>a.id=uid());(n.announcements||[]).forEach(a=>a.id=uid());n.checklist.forEach(a=>{a.id=uid();a.done=false});DB.camps.push(n);toast('Camp duplicated as draft');go('camp',n.id)}
function togglePublish(id){const c=DB.camps.find(x=>x.id===id);c.published=!c.published;toast(c.published?'Camp published':'Camp moved to drafts');render()}

function openCamperForm(cid,pid){
  const c=DB.camps.find(x=>x.id===cid);const p=pid?c.campers.find(x=>x.id===pid):{name:'',age:'',guardian:'',contact:'',status:enrolled(c)>=c.capacity?'Waitlisted':'Registered',notes:''};
  openModal(modalHeader(pid?'Edit camper':`Add camper to ${c.name}`)+`<form class="content" onsubmit="saveCamper(event,'${cid}','${pid||''}')"><div class="form">
    ${field('Full name',`<input name="name" required value="${esc(p.name)}">`)}${field('Age',`<input type="number" name="age" min="0" value="${p.age}">`)}
    ${field('Parent / guardian',`<input name="guardian" value="${esc(p.guardian)}">`)}${field('Contact (email or phone)',`<input name="contact" value="${esc(p.contact)}">`)}
    ${field('Status',`<select name="status">${STATUSES.map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select>`)}
    ${field('Notes (allergies, medical, etc.)',`<input name="notes" value="${esc(p.notes)}">`)}
    ${!pid&&enrolled(c)>=c.capacity?(waitFull(c)?`<p class="sub full" style="color:var(--danger)">⛔ Camp and waitlist are both full (${waitlisted(c)}/${waitMax(c)} waitlisted). Only Cancelled entries can be added.</p>`:`<p class="sub full" style="color:var(--accent)">⚠️ This camp is full — new campers default to the waitlist${waitMax(c)!=null?` (${waitlisted(c)}/${waitMax(c)} spots used)`:''}.</p>`):''}
    </div><footer>${pid?`<button type="button" class="btn danger left" onclick="closeModal(true);removeCamper('${cid}','${pid}')">Remove</button>`:''}<button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">${pid?'Save':'Add camper'}</button></footer></form>`);
}
function saveCamper(e,cid,pid){e.preventDefault();const o=Object.fromEntries(new FormData(e.target).entries());const c=DB.camps.find(x=>x.id===cid);const d={name:o.name.trim(),age:o.age?+o.age:'',guardian:o.guardian.trim(),contact:o.contact.trim(),status:o.status,notes:o.notes.trim()};
  const prev=pid?c.campers.find(x=>x.id===pid).status:null;
  if(d.status==='Waitlisted'&&prev!=='Waitlisted'&&waitFull(c)){toast(`Waitlist is full (max ${waitMax(c)})`);return}
  let p;if(pid){p=c.campers.find(x=>x.id===pid);Object.assign(p,d)}else{p={id:uid(),...d};c.campers.push(p)}
  stampWaitlist(p);const promoted=promoteWaitlist(c);closeModal(true);render();
  if(p.status==='Waitlisted')showWaitlistModal(c.id,p.id);else if(promoted)toast(`${promoted} camper${promoted>1?'s':''} moved off the waitlist`);else toast(pid?'Camper updated':'Camper added')}
function showWaitlistModal(cid,pid){const c=DB.camps.find(x=>x.id===cid);const p=c.campers.find(x=>x.id===pid);const pos=waitPos(c,p);const ord=n=>n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');
  openModal(modalHeader('On the waitlist ⏳')+`<div class="content" style="text-align:center"><div style="font-size:48px">${c.emoji}</div>
    <h3 style="margin:6px 0 4px;font-size:20px">${esc(p.name)}, you are <span style="color:var(--accent)">${ord(pos)}</span> in line</h3>
    <p class="sub" style="margin:0 0 6px">for <b>${esc(c.name)}</b>${waitMax(c)!=null?` · waitlist ${waitlisted(c)}/${waitMax(c)}`:''}</p>
    ${pos===1?`<div class="wl-note first">🎯 You're first in line — <b>if a spot opens up, you will join the camp automatically.</b></div>`:`<div class="wl-note">You'll move up as campers ahead of you get in. The 1st person in line joins automatically when a spot opens.</div>`}
    <footer style="justify-content:center"><button class="btn primary" onclick="closeModal(true)">Got it</button></footer></div>`)}
function removeCamper(cid,pid){const c=DB.camps.find(x=>x.id===cid);const p=c.campers.find(x=>x.id===pid);if(!confirm(`Remove ${p.name} from this camp?`))return;c.campers=c.campers.filter(x=>x.id!==pid);const n=promoteWaitlist(c);toast(n?'Camper removed · next in line joined the camp':'Camper removed');render()}
function setStatus(cid,pid,s){const c=DB.camps.find(x=>x.id===cid);const p=c.campers.find(x=>x.id===pid);if(s==='Waitlisted'&&p.status!=='Waitlisted'&&waitFull(c)){toast(`Waitlist is full (max ${waitMax(c)})`);render();return}p.status=s;stampWaitlist(p);const n=promoteWaitlist(c);toast(n&&s!=='Waitlisted'?`Status set to ${s} · next in line joined the camp`:`Status set to ${s}`);render()}

function openActivityForm(cid,day,aid){
  const c=DB.camps.find(x=>x.id===cid);const a=aid?c.activities.find(x=>x.id===aid):{day,time:'09:00',title:'',location:'',notes:''};
  openModal(modalHeader(aid?'Edit activity':'Add activity')+`<form class="content" onsubmit="saveActivity(event,'${cid}','${aid||''}')"><div class="form">
    ${field('Activity',`<input name="title" required placeholder="e.g. Canoeing 101" value="${esc(a.title)}">`,true)}
    ${field('Day',`<select name="day">${Array.from({length:days(c)},(_,i)=>`<option value="${i+1}" ${a.day===i+1?'selected':''}>Day ${i+1} · ${fmtShort(addDays(c.start,i))}</option>`).join('')}</select>`)}
    ${field('Time',`<input type="time" name="time" required value="${a.time}">`)}
    ${field('Location',`<input name="location" value="${esc(a.location)}">`)}${field('Notes',`<input name="notes" value="${esc(a.notes)}">`)}
    </div><footer><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">${aid?'Save':'Add activity'}</button></footer></form>`);
}
function saveActivity(e,cid,aid){e.preventDefault();const o=Object.fromEntries(new FormData(e.target).entries());const c=DB.camps.find(x=>x.id===cid);const d={day:+o.day,time:o.time,title:o.title.trim(),location:o.location.trim(),notes:o.notes.trim()};
  if(aid)Object.assign(c.activities.find(x=>x.id===aid),d);else c.activities.push({id:uid(),...d});toast('Schedule updated');closeModal(true);render()}
function removeActivity(cid,aid){const c=DB.camps.find(x=>x.id===cid);c.activities=c.activities.filter(x=>x.id!==aid);render()}

function openStaffForm(cid){openModal(modalHeader('Add staff member')+`<form class="content" onsubmit="saveStaff(event,'${cid}')"><div class="form">
  ${field('Name',`<input name="name" required>`)}${field('Role',`<input name="role" list="roles" placeholder="Counselor, Lifeguard…" required><datalist id="roles"><option>Camp Director</option><option>Counselor</option><option>Lifeguard</option><option>Nurse</option><option>Instructor</option><option>Cook</option><option>Volunteer</option></datalist>`)}
  ${field('Contact',`<input name="contact">`,true)}</div><footer><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Add</button></footer></form>`)}
function saveStaff(e,cid){e.preventDefault();const o=Object.fromEntries(new FormData(e.target).entries());DB.camps.find(x=>x.id===cid).staff.push({id:uid(),name:o.name.trim(),role:o.role.trim(),contact:o.contact.trim()});toast('Staff added');closeModal(true);render()}
function removeStaff(cid,sid){const c=DB.camps.find(x=>x.id===cid);c.staff=c.staff.filter(x=>x.id!==sid);render()}

function openAnnouncementForm(cid,aid){
  const c=DB.camps.find(x=>x.id===cid);const a=aid?ann(c).find(x=>x.id===aid):{title:'',body:'',link:'',linkLabel:'',pinned:false};
  openModal(modalHeader(aid?'Edit announcement':'New announcement')+`<form class="content" onsubmit="saveAnnouncement(event,'${cid}','${aid||''}')"><div class="form">
    ${field('Title',`<input name="title" required placeholder="e.g. Packing list is ready!" value="${esc(a.title)}">`,true)}
    ${field('Message',`<textarea name="body" placeholder="Write your update… URLs are clickable automatically.">${esc(a.body)}</textarea>`,true)}
    ${field('Link URL (optional)',`<input type="url" name="link" placeholder="https://…" value="${esc(a.link)}">`)}
    ${field('Link label',`<input name="linkLabel" placeholder="e.g. Photo album" value="${esc(a.linkLabel)}">`)}
    <div class="field full"><label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:14px;color:var(--ink)"><input type="checkbox" name="pinned" ${a.pinned?'checked':''} style="width:16px;height:16px;accent-color:var(--brand)">Pin to top</label></div>
    </div><footer><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">${aid?'Save':'Post'}</button></footer></form>`);
}
function saveAnnouncement(e,cid,aid){e.preventDefault();const f=new FormData(e.target);const o=Object.fromEntries(f.entries());const c=DB.camps.find(x=>x.id===cid);
  let link=o.link.trim();if(link&&!/^https?:\/\//i.test(link))link='https://'+link;
  const d={title:o.title.trim(),body:o.body.trim(),link,linkLabel:o.linkLabel.trim(),pinned:f.has('pinned')};
  if(aid){Object.assign(ann(c).find(x=>x.id===aid),d,{updatedAt:new Date().toISOString()});toast('Announcement updated')}else{ann(c).unshift({id:uid(),...d,createdAt:new Date().toISOString()});toast('Announcement posted 📣')}
  closeModal(true);state.tab='announcements';render()}
function removeAnnouncement(cid,aid){const c=DB.camps.find(x=>x.id===cid);if(!confirm('Delete this announcement?'))return;c.announcements=ann(c).filter(x=>x.id!==aid);toast('Announcement deleted');render()}
function togglePin(cid,aid){const a=ann(DB.camps.find(x=>x.id===cid)).find(x=>x.id===aid);a.pinned=!a.pinned;render()}
function copyAnnouncement(cid,aid){const c=DB.camps.find(x=>x.id===cid);const a=ann(c).find(x=>x.id===aid);const txt=`${c.name} — ${a.title}\n\n${a.body}${a.link?`\n\n${a.linkLabel?a.linkLabel+': ':''}${a.link}`:''}`;(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Copied to clipboard')).catch(()=>{prompt('Copy this text:',txt)})}

function addCheck(cid,text){if(!text.trim())return;DB.camps.find(x=>x.id===cid).checklist.push({id:uid(),text:text.trim(),done:false});render()}
function toggleCheck(cid,id){const x=DB.camps.find(c=>c.id===cid).checklist.find(i=>i.id===id);x.done=!x.done;render()}
function removeCheck(cid,id){const c=DB.camps.find(x=>x.id===cid);c.checklist=c.checklist.filter(i=>i.id!==id);render()}

/* ============ Import / export ============ */
function exportData(){const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(DB,null,2));a.download=`campuser-backup-${today()}.json`;a.click();toast('Backup downloaded')}
function importData(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.camps))throw 0;DB=normalize(d);DB.camps.forEach(grantAccess);save();toast('Data imported');go('dashboard')}catch(e){toast('Invalid backup file')}};r.readAsText(f);input.value=''}
function resetData(){if(!confirm('Delete ALL camps and data? This cannot be undone.'))return;GROUPMEM={};store.set(GROUPS_KEY,'{}');store.del(STATE_KEY);DB=normalize(seed());ACCESS=new Set();saveAccess();clearDraft();save._last=null;save();toast('All data cleared');go('dashboard')}

restoreView();render();

/* ============ Install (PWA) ============ */
const IS_IOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const IS_SAFARI=/^((?!chrome|android|crios|fxios|edgios).)*safari/i.test(navigator.userAgent);
const IS_STANDALONE=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true||new URLSearchParams(location.search).get('source')==='pwa';
let deferredInstall=null;
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const nw=reg.installing;nw&&nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)toast('Campuser updated — reload to get the latest version')})})}).catch(()=>{})})}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;updateInstallUI();if(!store.get('campuser.installDismissed')&&!IS_STANDALONE())showInstallBanner()});
window.addEventListener('appinstalled',()=>{deferredInstall=null;hideInstallBanner();updateInstallUI();toast('Campuser installed 🎉 Find it on your home screen');});
function updateInstallUI(){const b=$('#installBtn');if(!b)return;b.classList.toggle('hidden',IS_STANDALONE());b.querySelector('span').textContent=IS_STANDALONE()?'Installed':'Install app'}
function showInstallBanner(){if($('#installBanner'))return;const d=document.createElement('div');d.id='installBanner';d.className='install-banner';d.innerHTML=`<img src="${$('link[rel=apple-touch-icon]').href}" alt=""><div class="t"><b>Install Campuser</b><small>Add it to your home screen for quick, full-screen access</small></div><button class="btn primary sm" onclick="installApp()">Install</button><button class="x" onclick="hideInstallBanner(true)" aria-label="Dismiss">✕</button>`;document.body.appendChild(d)}
function hideInstallBanner(remember){const d=$('#installBanner');if(d)d.remove();if(remember)store.set('campuser.installDismissed','1')}
async function installApp(){
  if(IS_STANDALONE()){toast('Campuser is already installed on this device');return}
  if(deferredInstall){const p=deferredInstall;deferredInstall=null;p.prompt();const {outcome}=await p.userChoice;if(outcome==='accepted'){hideInstallBanner()}else{deferredInstall=p;toast('You can install any time from the sidebar')}return}
  showInstallGuide();
}
const shareIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="m8 7 4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
const plusSq='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';
const dots='<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
function showInstallGuide(){
  const notHosted=!location.protocol.startsWith('http');
  let steps,title,note='';
  if(IS_IOS){
    title='Install on iPhone / iPad';
    if(!IS_SAFARI)note=`<div class="draft-note" style="text-align:left">On iPhone and iPad, apps can only be installed from <b>Safari</b>. Open <b>${esc(location.origin+location.pathname)}</b> in Safari, then follow these steps.</div>`;
    steps=[`Tap the <b>Share</b> button ${shareIcon} at the bottom of Safari (top‑right on iPad).`,`Scroll down and tap <b>Add to Home Screen</b> ${plusSq}.`,`Tap <b>Add</b> in the top‑right corner. Campuser will appear on your home screen like a regular app.`];
  }else if(/android/i.test(navigator.userAgent)){
    title='Install on Android';
    steps=[`Tap the <b>⋮ menu</b> ${dots} in the top‑right of Chrome.`,`Tap <b>Install app</b> (or <b>Add to Home screen</b>).`,`Confirm with <b>Install</b>. Campuser will open full‑screen from your home screen.`];
  }else if(/macintosh/i.test(navigator.userAgent)&&IS_SAFARI){
    title='Install on Mac (Safari)';
    steps=[`Click <b>File</b> in the menu bar.`,`Choose <b>Add to Dock…</b>`,`Click <b>Add</b>. Campuser will open as its own app from the Dock.`];
  }else{
    title='Install on your computer';
    steps=[`Look for the <b>install icon</b> in the right side of the address bar (Chrome & Edge), or open the browser <b>⋮ menu</b>.`,`Choose <b>Install Campuser</b> / <b>Apps → Install this site as an app</b>.`,`Confirm. Campuser will open in its own window and appear in your app launcher.`];
  }
  if(notHosted)note+=`<div class="draft-note" style="text-align:left">Installing only works from a published web address (like your GitHub Pages site), not from a local file.</div>`;
  openModal(modalHeader(`📲 ${title}`)+`<div class="content" style="text-align:center">
    <img src="${$('link[rel=apple-touch-icon]').href}" alt="Campuser" style="width:84px;height:84px;border-radius:20px;box-shadow:0 6px 20px rgba(0,0,0,.2)">
    <p class="sub" style="margin:12px 0 0">Get Campuser on your home screen — full‑screen, works offline, and keeps all your camps.</p>
    ${note}
    <ol class="install-steps">${steps.map((t,i)=>`<li><span class="num">${i+1}</span><span>${t}</span></li>`).join('')}</ol>
    <footer style="justify-content:center"><button class="btn" onclick="copyText(location.origin+location.pathname).then(ok=>toast(ok?'Link copied':'Could not copy'))">🔗 Copy link</button><button class="btn primary" onclick="closeModal(true)">Got it</button></footer></div>`);
}
updateInstallUI();
// Home-screen shortcuts (from manifest) & PWA launch params
(()=>{const a=new URLSearchParams(location.search).get('action');if(a==='newcamp')setTimeout(()=>openCampForm(),300);if(a==='join')setTimeout(()=>openJoinModal(),300);if(a||location.search.includes('source=pwa'))history.replaceState(null,'',location.pathname+location.hash)})();

function handleHash(){const m=location.hash.match(/#join=(\d{16})/);if(!m)return;history.replaceState(null,'',location.pathname+location.search);const code=m[1];const c=campByCode(code);
  if(c&&hasAccess(c)){go('camp',c.id);return}
  openJoinModal(c?c.id:null);const inp=$('.code-input');if(inp){inp.value=code;fmtCodeInput(inp)}
  if(c){setTimeout(()=>$('#modal form')?.requestSubmit?.(),250)}else{const err=$('#joinErr');if(err){err.textContent='This QR code belongs to a camp that isn\'t stored in this browser yet. Ask the organizer to share their camp (Export → Import) or open the link on their site.';err.hidden=false}}}
window.addEventListener('hashchange',handleHash);handleHash();
</script>
